services:
  db:
    image: postgres:16-alpine
    container_name: sensorhub-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sensor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sensor_password}
      POSTGRES_DB: ${POSTGRES_DB:-sensor_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sensor_user} -d $${POSTGRES_DB:-sensor_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: sensorhub-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sensor_user}:${POSTGRES_PASSWORD:-sensor_password}@db:5432/${POSTGRES_DB:-sensor_db}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: