name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write  # Permiso para crear un Issue si el pipeline falla

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    # 1. SERVICIO DE POSTGRESQL PARA SMOKE TESTS
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_sensorhub_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff mypy

      - name: Análisis estático (Linter y Tipos)
        run: |
          ruff check .
          mypy app/ --ignore-missing-imports || true

      - name: Ejecutar Tests contra PostgreSQL Real
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_sensorhub_db
        run: |
          pytest

      - name: Construir Imagen Docker
        run: |
          docker build -t sensorhub-api:latest .

      # 2. ESCANEO DE VULNERABILIDADES CON TRIVY
      - name: Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sensorhub-api:latest'
          format: 'table'
          exit-code: '0' # Permite continuar pero reporta las vulnerabilidades
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 3. CREACIÓN AUTOMÁTICA DE ISSUE SI EL PIPELINE FALLA EN MAIN
      - name: Crear Issue automático si el pipeline falla
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Fallo en el Pipeline CI (Commit ${context.sha.substring(0, 7)})`,
              body: `El pipeline de Integración Continua en la rama **main** ha fallado.\n\n` +
                    `* **Commit:** ${context.sha}\n` +
                    `* **Autor:** ${context.actor}\n` +
                    `* **Ver Logs de Ejecución:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })