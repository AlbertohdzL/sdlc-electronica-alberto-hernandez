name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sensor_user
          POSTGRES_PASSWORD: sensor_password
          POSTGRES_DB: sensor_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificación de Linter (Ruff)
        run: python -m ruff check .

      - name: Verificación de Tipos (MyPy)
        run: python -m mypy app/

      - name: Pruebas unitarias y Cobertura (Pytest)
        env:
          DATABASE_URL: postgresql://sensor_user:sensor_password@localhost:5432/sensor_db
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=80